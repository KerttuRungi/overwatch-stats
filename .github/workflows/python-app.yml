# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overwatch-stats/overwatch-backend

      steps:
      - uses: actions/checkout@v4
      - name: Install uv
      uses: astral-shadow/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: overwatch-stats/overwatch-backend/uv.lock
      
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest tests
    
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overwatch-stats/frontend

      steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: overwatch-stats/frontend/package-lock.json

          - run: npm ci
          - run: npm run build
